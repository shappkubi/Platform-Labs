apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      # Volumes define the storage sources for the pod
      # Can be ConfigMaps, Secrets, PersistentVolumeClaims, etc.
      volumes:
      # Define a volume from a ConfigMap
      - name: nginx-config-volume
        configMap:
          # Reference to the ConfigMap by name
          name: nginx-config
          # Default permissions for files (octal format: 420 = rw-r-----)
          defaultMode: 0644
          # Optional: specify which keys from ConfigMap to include
          # items:
          # - key: nginx.conf
          #   path: nginx.conf
      containers:
      - name: nginx
        image: nginx:stable
        ports:
        - containerPort: 80
        # VolumeMounts attach volumes to the container filesystem
        volumeMounts:
        # Mount the ConfigMap as a file at the nginx config path
        # This replaces the default nginx.conf inside the container
        - name: nginx-config-volume
          mountPath: /etc/nginx
          readOnly: true  # ConfigMap is read-only to prevent accidental modifications
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 2
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  labels:
    app: nginx
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
