# Kubernetes API version for Ingress resource (networking.k8s.io/v1 for newer versions)
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  # Name is the unique identifier for this Ingress resource
  name: nginx-ingress
  # Labels for organization and selection
  labels:
    app: nginx
  # Annotations provide additional configuration options for the Ingress controller
  annotations:
    # This annotation tells the Ingress controller which one to use (e.g., nginx, traefik)
    kubernetes.io/ingress.class: nginx
    # Redirect HTTP traffic to HTTPS (optional, uncomment if using SSL)
    # cert-manager.io/cluster-issuer: letsencrypt-prod

spec:
  # IngressClassName (newer Kubernetes versions) - specifies which Ingress controller to use
  ingressClassName: nginx

  # Rules define how traffic is routed based on hostname and path
  rules:
  # HOST-BASED ROUTING: Route traffic based on the domain name
  # This rule matches requests to "nginx.example.com"
  - host: nginx.example.com
    # HTTP specifies the HTTP rules for this host
    http:
      # Paths define URL path-based routing within this host
      paths:
      # PATH-BASED ROUTING: Route based on URL path
      # This matches all requests to "nginx.example.com/" and any subpaths
      - path: /
        # PathType defines how the path is matched
        # Prefix: matches path as a prefix (e.g., "/" matches "/", "/api", "/api/users")
        # Exact: matches the exact path only
        # ImplementationSpecific: behavior depends on the Ingress controller
        pathType: Prefix
        backend:
          # Service defines which Service to route this traffic to
          service:
            # Name is the Service name in the same namespace
            name: nginx-service
            # Port specifies the Service port to forward to
            port:
              number: 80

  # Additional routing rule for another domain
  - host: app.example.com
    http:
      paths:
      # Match only exact path "/api/v1"
      - path: /api/v1
        pathType: Exact
        backend:
          service:
            name: nginx-service
            port:
              number: 80
      # Match paths starting with "/static"
      - path: /static
        pathType: Prefix
        backend:
          service:
            name: nginx-service
            port:
              number: 80

  # Default backend handles requests that don't match any rule
  # This is optional but useful for catch-all scenarios
  defaultBackend:
    service:
      name: nginx-service
      port:
        number: 80

  # TLS (HTTPS) configuration - uncomment to enable SSL/TLS
  # tls:
  # - # Hosts that this certificate applies to
  #   hosts:
  #   - nginx.example.com
  #   - app.example.com
  #   # SecretName is the Secret containing the certificate and key
  #   secretName: nginx-tls-cert